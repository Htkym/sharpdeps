name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag equals current reviewed main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Test-MainRelease.ps1 -CiWorkflow ci.yml -ReleaseTag $env:GITHUB_REF_NAME -RequireTag

      - name: Check release version
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/check-release.js --tag "$GITHUB_REF_NAME"
          echo "VSIX_PATH=sharpdeps-$version.vsix" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: |
          npm run lint
          npm run format:check
          npm run compile

      - name: Build the analyzer hosts
        run: npm run build:analyzer

      - name: Prepare semantic fixture
        run: |
          dotnet restore tests/fixtures/semantic-baseline/SemanticBaseline.sln
          dotnet restore tests/fixtures/project-kinds/ProjectKinds.slnx
          dotnet build tests/fixtures/semantic-baseline/src/Generator/Generator.csproj --no-restore

      - name: C# tests
        run: dotnet test analyzer/SharpDeps.Analyzer.slnx -c Release

      - name: TypeScript and analyzer contract tests
        run: npm test

      - name: Check and package VSIX
        run: |
          npm run check:vsix
          mv sharpdeps-check.vsix "$VSIX_PATH"
          sha256sum "$VSIX_PATH" > "$VSIX_PATH.sha256"

      - name: Pack and verify release tools
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack analyzer/src/SharpDeps.Cli/SharpDeps.Cli.csproj -c Release -p:Version="$version" --artifacts-path "$RUNNER_TEMP/sharpdeps-cli" -o artifacts/release-tools
          dotnet pack analyzer/src/SharpDeps.Mcp/SharpDeps.Mcp.csproj -c Release -p:Version="$version" --artifacts-path "$RUNNER_TEMP/sharpdeps-mcp" -o artifacts/release-tools
          node scripts/check-release.js --tag "$GITHUB_REF_NAME" --vsix "$VSIX_PATH" --cli-package "artifacts/release-tools/SharpDeps.Cli.$version.nupkg" --mcp-package "artifacts/release-tools/SharpDeps.Mcp.$version.nupkg" > artifacts/release-tools/release-identity.json
          (cd artifacts/release-tools && sha256sum *.nupkg > SHA256SUMS)

      - name: Preserve verified tools for NuGet publication
        uses: actions/upload-artifact@v4
        with:
          name: sharpdeps-release-tools-${{ github.sha }}
          path: artifacts/release-tools/
          if-no-files-found: error

      - name: Recheck main before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Test-MainRelease.ps1 -CiWorkflow ci.yml -ReleaseTag $env:GITHUB_REF_NAME -RequireTag

      - name: Publish to Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --no-install vsce publish --packagePath "$VSIX_PATH" --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish "$VSIX_PATH" --pat "$OVSX_PAT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$VSIX_PATH" "$VSIX_PATH.sha256" artifacts/release-tools/*.nupkg artifacts/release-tools/SHA256SUMS --verify-tag --notes-file CHANGELOG.md

  publish-nuget:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release tag equals current reviewed main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Test-MainRelease.ps1 -CiWorkflow ci.yml -ReleaseTag $env:GITHUB_REF_NAME -RequireTag
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: sharpdeps-release-tools-${{ github.sha }}
          path: artifacts/release-tools
      - name: Verify stable inputs and tool checksums
        run: |
          node scripts/check-release.js --tag "$GITHUB_REF_NAME"
          (cd artifacts/release-tools && sha256sum -c SHA256SUMS)
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish the verified tools to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for id in SharpDeps.Cli SharpDeps.Mcp; do
            dotnet nuget push "artifacts/release-tools/$id.$version.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          done

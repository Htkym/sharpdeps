name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run compile

      - name: Test
        run: npm test

      - name: Build the analyzer hosts
        run: npm run build:analyzer

      - name: Check the packaged VSIX content
        run: npm run check:vsix

      - name: Package VSIX
        run: npm run package

      # The end-to-end suite needs a VS Code binary. On CI that comes from
      # @vscode/test-electron, which the runner falls back to when no installation is
      # present; locally the installed VS Code is used instead.
      - name: End-to-end (VS Code)
        run: |
          npm install --no-save @vscode/test-electron
          npm run test:e2e
        continue-on-error: true

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharpdeps-vsix
          path: '*.vsix'
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Check candidate definitions
        run: npm run check:release

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run compile

      - name: Build the analyzer hosts
        run: npm run build:analyzer

      - name: Prepare semantic fixture
        run: |
          dotnet restore tests/fixtures/semantic-baseline/SemanticBaseline.sln
          dotnet restore tests/fixtures/project-kinds/ProjectKinds.slnx
          dotnet build tests/fixtures/semantic-baseline/src/Generator/Generator.csproj --no-restore

      - name: C# tests
        run: dotnet test analyzer/SharpDeps.Analyzer.slnx -c Release

      - name: TypeScript and analyzer contract tests
        run: npm test

      - name: Build webview
        run: npm run build

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Check the packaged VSIX content
        run: npm run check:vsix

      - name: Pack and check CLI candidate
        run: |
          version="$(node -p "require('./package.json').version")-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          dotnet pack analyzer/src/SharpDeps.Cli/SharpDeps.Cli.csproj -c Release -p:Version="$version" --artifacts-path "$RUNNER_TEMP/sharpdeps-cli" -o artifacts/cli
          node scripts/check-release.js --vsix sharpdeps-check.vsix --cli-package "artifacts/cli/SharpDeps.Cli.$version.nupkg" --cli-version "$version" > artifacts/cli/candidate-identity.json

      - name: Upload CLI candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sharpdeps-cli-candidate
          path: artifacts/cli/
          if-no-files-found: error

      - name: Pack and check optional MCP candidate
        run: |
          version="$(node -p "require('./package.json').version")-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          dotnet pack analyzer/src/SharpDeps.Mcp/SharpDeps.Mcp.csproj -c Release -p:Version="$version" --artifacts-path "$RUNNER_TEMP/sharpdeps-mcp" -o artifacts/mcp
          node scripts/check-release.js --mcp-package "artifacts/mcp/SharpDeps.Mcp.$version.nupkg" --mcp-version "$version" > artifacts/mcp/candidate-identity.json

      - name: Upload optional MCP candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sharpdeps-mcp-candidate
          path: artifacts/mcp/
          if-no-files-found: error

      # The end-to-end suite needs a VS Code binary. On CI that comes from
      # @vscode/test-electron, which the runner falls back to when no installation is
      # present; locally the installed VS Code is used instead.
      - name: End-to-end (VS Code)
        run: xvfb-run -a npm run test:e2e

      - name: End-to-end (installed VSIX)
        run: xvfb-run -a npm run test:e2e
        env:
          SHARPDEPTS_E2E_MODE: vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sharpdeps-vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-verification
          path: |
            .local/verification/sd-027-e2e*.json
            .local/verification/sd-028-browser.json
            .local/verification/sd-029-vsix.json
            .local/browser-results/

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Record environment
        run: |
          mkdir -p .local/ci
          sw_vers > .local/ci/macos.txt
          dotnet --info > .local/ci/dotnet.txt
      - run: npm ci
      - name: Publish Quick and Semantic hosts
        run: npm run build:analyzer
      - name: Prepare semantic fixture
        run: |
          dotnet restore tests/fixtures/semantic-baseline/SemanticBaseline.sln
          dotnet restore tests/fixtures/project-kinds/ProjectKinds.slnx
          dotnet build tests/fixtures/semantic-baseline/src/Generator/Generator.csproj --no-restore
      - name: C# tests
        run: dotnet test analyzer/SharpDeps.Analyzer.slnx -c Release --logger trx --results-directory .local/ci/dotnet
      - name: Quick and Semantic golden and contract tests
        run: npx vitest run tests/analyzer tests/contract --reporter=default --reporter=json --outputFile=.local/ci/analyzers.json
      - name: Upload macOS verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-verification
          path: .local/ci/
          if-no-files-found: error

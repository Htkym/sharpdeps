name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Check candidate definitions
        run: npm run check:release

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run compile

      - name: Build the analyzer hosts
        run: npm run build:analyzer

      - name: Prepare semantic fixture
        run: |
          dotnet restore tests/fixtures/semantic-baseline/SemanticBaseline.sln
          dotnet restore tests/fixtures/project-kinds/ProjectKinds.slnx
          dotnet build tests/fixtures/semantic-baseline/src/Generator/Generator.csproj --no-restore

      - name: C# tests
        run: dotnet test analyzer/SharpDeps.Analyzer.slnx -c Release

      - name: TypeScript and analyzer contract tests
        run: npm test

      - name: Build webview
        run: npm run build

      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Check the packaged VSIX content
        run: npm run check:vsix

      - name: Pack and check CLI candidate
        run: |
          version="$(node -p "require('./package.json').version")-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          dotnet pack analyzer/src/SharpDeps.Cli/SharpDeps.Cli.csproj -c Release -p:Version="$version" --artifacts-path "$RUNNER_TEMP/sharpdeps-cli" -o artifacts/cli
          node scripts/check-release.js --vsix sharpdeps-check.vsix --cli-package "artifacts/cli/SharpDeps.Cli.$version.nupkg" --cli-version "$version" > artifacts/cli/candidate-identity.json

      - name: Upload CLI candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sharpdeps-cli-candidate
          path: artifacts/cli/
          if-no-files-found: error

      - name: Pack and check optional MCP candidate
        run: |
          version="$(node -p "require('./package.json').version")-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          dotnet pack analyzer/src/SharpDeps.Mcp/SharpDeps.Mcp.csproj -c Release -p:Version="$version" --artifacts-path "$RUNNER_TEMP/sharpdeps-mcp" -o artifacts/mcp
          node scripts/check-release.js --mcp-package "artifacts/mcp/SharpDeps.Mcp.$version.nupkg" --mcp-version "$version" > artifacts/mcp/candidate-identity.json
          node scripts/check-mcp-mutation.js "artifacts/mcp/SharpDeps.Mcp.$version.nupkg" "$version" > artifacts/mcp/mutation-helper.json

      - name: Upload optional MCP candidate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sharpdeps-mcp-candidate
          path: artifacts/mcp/
          if-no-files-found: error

      # The end-to-end suite needs a VS Code binary. On CI that comes from
      # @vscode/test-electron, which the runner falls back to when no installation is
      # present; locally the installed VS Code is used instead.
      - name: End-to-end (VS Code)
        run: xvfb-run -a npm run test:e2e

      - name: End-to-end (installed VSIX)
        run: xvfb-run -a npm run test:e2e
        env:
          SHARPDEPTS_E2E_MODE: vsix

      - name: End-to-end (packaged saved-source encodings)
        run: xvfb-run -a npm run test:e2e
        env:
          SHARPDEPTS_E2E_MODE: vsix
          SHARPDEPTS_E2E_SCENARIO: saved-source
          SHARPDEPTS_E2E_PROFILE: .local/e2e-vsix-saved-source

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sharpdeps-vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-verification
          path: |
            .local/verification/sd-027-e2e*.json
            .local/verification/sd-028-browser.json
            .local/verification/sd-029-vsix.json
            .local/verification/sd-030-saved-source.json
            .local/browser-results/

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v6.0.0
        env:
          # Keep the bounded reuse proof independent of unrelated preinstalled SDKs/runtimes.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/sharpdeps-dotnet
        with:
          dotnet-version: 10.0.x
      - name: Record environment
        run: |
          mkdir -p .local/ci
          sw_vers > .local/ci/macos.txt
          dotnet --info > .local/ci/dotnet.txt
      - run: npm ci
      - name: Publish Quick and Semantic hosts
        run: npm run build:analyzer
      - name: Prepare semantic fixture
        run: |
          dotnet restore tests/fixtures/semantic-baseline/SemanticBaseline.sln
          dotnet restore tests/fixtures/project-kinds/ProjectKinds.slnx
          dotnet build tests/fixtures/semantic-baseline/src/Generator/Generator.csproj --no-restore
      - name: C# tests
        run: |
          # Keep test scratch paths free of macOS temporary-directory symlink ancestors.
          printf 'Original TMPDIR: %s\n' "${TMPDIR:-<unset>}"
          export TMPDIR="$(cd "$RUNNER_TEMP" && pwd -P)/sharpdeps-tests"
          mkdir -p "$TMPDIR"
          printf 'Test TMPDIR: %s\n' "$TMPDIR"
          ancestor="$TMPDIR"
          while [ "$ancestor" != / ]; do
            if [ -L "$ancestor" ]; then
              printf 'Unexpected symlink ancestor: %s\n' "$ancestor" >&2
              exit 1
            fi
            ancestor="$(dirname "$ancestor")"
          done
          dotnet test analyzer/SharpDeps.Analyzer.slnx -c Release --logger trx --results-directory .local/ci/dotnet
      - name: Quick and Semantic golden and contract tests
        run: npx vitest run tests/analyzer tests/contract --reporter=default --reporter=json --outputFile=.local/ci/analyzers.json
      - name: Record reuse proof inputs
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["DOTNET_ROOT"])
          sdks = sorted((p for p in (root / "sdk").iterdir() if p.name.startswith("10.") and all(x.isdigit() for x in p.name.split("."))), key=lambda p: tuple(map(int, p.name.split("."))))
          groups = [("sdk", sdks[-1]), ("packs", root / "packs" / "Microsoft.NETCore.App.Ref")]
          groups += [(name, root / name) for name in ("shared", "host", "sdk-manifests", "metadata")]
          groups += [("tool", pathlib.Path("analyzer/tests/SharpDeps.Cli.Tests/bin/Release/net10.0"))]
          result = []
          for name, path in groups:
              files = size = entries = 0
              links = []
              largest = []
              pending = [path]
              while pending:
                  current = pending.pop()
                  if current.is_symlink():
                      links.append(str(current))
                      continue
                  if not current.exists():
                      continue
                  if current.is_dir():
                      children = list(current.iterdir())
                      entries += len(children)
                      pending.extend(children)
                  else:
                      length = current.stat().st_size
                      files += 1
                      size += length
                      largest.append((length, str(current)))
              result.append(dict(group=name, path=str(path), files=files, entries=entries, bytes=size,
                                 links=links, largest=sorted(largest, reverse=True)[:5]))
          output = dict(groups=result, totalBytes=sum(x["bytes"] for x in result),
                        totalEntries=sum(x["entries"] for x in result),
                        limits="Diagnostic inventory only; no proof admission or budget is changed.")
          pathlib.Path(".local/ci/proof-input-inventory.json").write_text(json.dumps(output, indent=2) + "\n")
          PY
      - name: Upload macOS verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-verification
          path: |
            .local/ci/
            ${{ runner.temp }}/sharpdeps-tests/sharpdeps-full-oracle/
            ${{ runner.temp }}/sharpdeps-tests/sde-cli/
          if-no-files-found: error
